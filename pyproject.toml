[project]
name = "neotrader-clone"
version = "1.0.0"
description = "NeoTrader Web Platform and Trading Software Replica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
