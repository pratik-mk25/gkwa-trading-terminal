<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="gkwaGrad1w" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gkwaGrad2w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="gloww" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Stylized Geometric Trading Emblem -->
  <g transform="translate(6, 6)">
    <!-- Hex / Diamond Shield Background -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <!-- Dynamic Trading Wave 'G' / Uptrend Bars -->
    <path d="M 12 34 L 19 24 L 27 30 L 37 14" fill="none" stroke="url(#gkwaGrad1w)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#gloww)"/>
    <circle cx="37" cy="14" r="3.5" fill="#10b981" />
    
    <!-- Secondary Dynamic Pulse Line -->
    <path d="M 13 22 L 20 16 L 26 21" fill="none" stroke="url(#gkwaGrad2w)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Typography: GKWA -->
  <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#ffffff">
    GKWA
  </text>
  
  <!-- Subtle Tagline: TRADING TERMINAL -->
  <text x="65" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#38bdf8">
